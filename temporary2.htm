<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: black;
        }

        #ok {
            height: 100vh;
            width: 100vw;

        }

        #box {
            height: 100px;
            width: 100vw;
            background-color: white;
            display: flex;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        #tin {
            height: 100px;
            width: 100px;
        }

        #one {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-left: 30px;
        }

        #three {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-right: 20px;
        }

        #for {
            position: relative;
        }

        #title {
            position: absolute;
            top: 100px;
            left: 250px;
            transform: translate(-50%, -50%);
            color: white;
        }

        #message {
            position: absolute;
            top: 150px;
            left: 190px;
            transform: translate(-50%, -50%);
            color: white;
        }

        #buttons {
            position: absolute;
            top: 230px;
            left: 200px;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
        }

        #button1 {
            height: 50px;
            width: 150px;    
            border-radius: 5px;
        }

        button {
            height: 100%;
            width: 100%;
            border: none;
        }
        #button2 button {
    background-color: black;
    opacity: 0.3;
    color: white;
}   

        #button2 {
            height: 50px;
            width: 150px;
    background-color: transparent;
    color: black;
  
        }
    </style>
</head>

<body>
    <div id="box">
        <div id="one"><a href="https://example.com">Vehicles</a>
            <a href="https://example.com">Owners</a>
            <a href="https://example.com">Explore</a>
            <a href="https://example.com">Shop Now</a>
        </div>
        <div id="two"><img id="tin" src="./range-rover-2.svg" alt="Image"></div>
        <div id="three">
            <h3>Retailers</h3>
            <h3>Builds</h3>
            <h3>Support and chat</h3>
        </div>
    </div>
    <div id="for"><img id="ok" src="./range rover.jpg" alt="Image">
        <h1 id="title">BESPOKE DUO-TONE FADE <br>FINISH </h1>
        <div id="message">FOR THE FIRST TIME ON RANGE ROVER</div>
        <div id="buttons">
            <div id="button1"><button>Commission Yours</button></div>
            <div id="button2"><button>Find Out More</button></div>
        </div>





    </div>

</body>

</html>
