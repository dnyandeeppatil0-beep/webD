<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body{
    perspective: 900px;
    background-color: aqua;
}
#main{
    height: 250px;
    width: 400px;
    margin: 10px auto;
    position: relative;
    transition: 1s;
    transform-style: preserve-3d;

}
#main:hover{
    transform: rotateY(180deg);
}
#one{
    height: 250px;
    width: 100%;
    background-color: bisque;
    position: absolute;
    z-index: 1;
    backface-visibility: hidden;
    
    
}
div{
div {
  transform:
    perspective(750px)
    translate3d(0px, 0px, -250px)
    rotateX(27deg)
    scale(0.9, 0.9);
  border-radius: 20px;
  border: 5px solid #e6e6e6;
  box-shadow: 0 70px 40px -20px rgba(0, 0, 0, 0.2);
  transition: 0.4s ease-in-out transform;

  &:hover {
    transform: translate3d(0px, 0px, -250px);
  }
}
}
#two{
    height: 250px;
    width: 100%;
    background-color: rgb(227, 148, 50);
     position: absolute;
}
#two:hover{
    transform: rotateY(180deg);
}
h2{
    position: absolute;
    top: 80px;
    left: 60px;
}
    </style>
</head>
<body>
    <h1><center>3D TRAFORMATION</center></h1>
    <div id="main">
        <div id="one"><h2><center>Click here To See ADYPU</center></h2></div>
        <div id="two"><img height="250px" width="400px" src="https://d13loartjoc1yn.cloudfront.net/upload/institute/images/large/1740027167EDGizQNCSq73IF4nQG95UMwUzQ.webp"/></div>
    </div>
</body>
</html>
